name: collaborative-editor

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-editor}
      POSTGRES_USER: ${POSTGRES_USER:-editor}
      # No default: an unset password must fail loudly rather than start a
      # database with a well-known credential (PROJECT_SPEC.md §7).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-editor} -d ${POSTGRES_DB:-editor}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: src/Editor.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      # No defaults, for the same reason POSTGRES_PASSWORD has none: the API
      # refuses to start without an issuer (PROJECT_SPEC.md §7), and a value
      # supplied here would be exactly the fallback §7 forbids — a stack that
      # comes up authenticating against whatever was convenient at the time.
      Oidc__Issuer: ${OIDC_ISSUER:?set OIDC_ISSUER in .env}
      Oidc__Audience: ${OIDC_AUDIENCE:?set OIDC_AUDIENCE in .env}
      Oidc__MetadataAddress: ${OIDC_METADATA_ADDRESS:?set OIDC_METADATA_ADDRESS in .env}
      # Service name, not localhost. A default here would be a fallback that
      # connects to nothing and issues tickets nobody can redeem.
      Redis__Configuration: ${REDIS_CONFIGURATION:?set REDIS_CONFIGURATION in .env}
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
