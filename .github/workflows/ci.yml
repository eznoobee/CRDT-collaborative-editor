name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:
  dotnet:
    name: .NET build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore CollaborativeEditor.slnx

      - name: Verify formatting
        run: dotnet format CollaborativeEditor.slnx --verify-no-changes --no-restore

      - name: Build
        # TreatWarningsAsErrors comes from Directory.Build.props, so a new
        # warning fails here (PROJECT_SPEC.md §3).
        run: dotnet build CollaborativeEditor.slnx --no-restore -c Release

      - name: Test
        # CI=true makes the Testcontainers smoke tests fail rather than skip
        # when Docker is unavailable — Phase 0 done-when (d).
        env:
          CI: "true"
        run: ./scripts/run-tests.sh

  conformance:
    name: Cross-implementation conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
        working-directory: client

      # PROJECT_SPEC.md §9: any divergence between the two cores fails the build.
      - run: ./scripts/conformance.sh

  mutation:
    name: Crdt.Core mutation score
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - run: dotnet tool restore

      # PROJECT_SPEC.md §5 sets the bar at 85% mutation score, replacing line
      # coverage. The reduced case count keeps a per-mutant suite run to
      # seconds; the full 10,000-case gate runs in the dotnet job above.
      - name: Stryker
        run: ./scripts/mutation.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: StrykerOutput/**/reports/*.html
          if-no-files-found: ignore

  client:
    name: Client lint, typecheck and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  compose:
    name: Compose stack smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate a local-only Postgres password
        # docker-compose.yml deliberately has no default password
        # (PROJECT_SPEC.md §7), so CI supplies an ephemeral one.
        run: |
          {
            echo "POSTGRES_DB=editor"
            echo "POSTGRES_USER=editor"
            echo "POSTGRES_PASSWORD=$(openssl rand -base64 24)"
            echo "API_PORT=8080"
          } > .env

      - name: Start the stack
        run: docker compose up --build --detach --wait --wait-timeout 300

      - name: Liveness endpoint responds
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://localhost:8080/health/live; then
              echo
              echo "Liveness OK on attempt ${attempt}."
              exit 0
            fi
            sleep 2
          done
          echo "Liveness endpoint never responded."
          exit 1

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down --volumes

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # PROJECT_SPEC.md §7 requires a CI step that fails on committed secrets.
      # The action is free for public repositories; a private repository would
      # need a GITLEAKS_LICENSE secret.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
