# Where TLS terminates (PROJECT_SPEC.md §4).
#
# The API speaks plaintext on a network no client can reach, and learns its
# external scheme from X-Forwarded-Proto set here — never from a client. The
# API's own port is not published; this is the only way in.

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;

    # TLS 1.2 is kept for reach; anything below it is not negotiable.
    ssl_protocols TLSv1.2 TLSv1.3;

    # §7's caps are enforced by the application, which returns a structured
    # rejection the client can act on (§13.13). A proxy limit below the
    # application's would turn those into an opaque 413 the client cannot
    # recover from, so this sits above §7's 64 KB message cap rather than under
    # it.
    client_max_body_size 1m;

    location / {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;

        # The SignalR upgrade. Without these two the hub silently falls back or
        # fails to connect, and every §8 assertion about broadcast becomes a
        # test of long polling at best.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # What §4 is about: the API cannot see that the client arrived over TLS
        # unless this says so, and it must come from here rather than from the
        # client.
        proxy_set_header X-Forwarded-Proto $scheme;

        # A websocket that idles between keystrokes must not be reaped.
        proxy_read_timeout  1h;
        proxy_send_timeout  1h;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
